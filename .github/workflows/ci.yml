# CI: build frontendu przy każdym pushu i PR.
# Programu on-chain tu nie budujemy (toolchain Solana/Anchor jest ciężki): testy programu
# uruchamiamy lokalnie przez `make test`. Deploy frontendu robi Vercel po podłączeniu repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
